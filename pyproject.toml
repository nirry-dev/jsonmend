[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsonmend"
version = "0.1.0"
description = "Turn almost-JSON from a language model into valid JSON — tolerant repair, with optional JSON Schema validation and coercion. Pure standard library."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nirry", email = "labs@nirry.net" }]
keywords = [
    "json",
    "llm",
    "repair",
    "parsing",
    "json-schema",
    "validation",
    "structured-output",
    "openai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://nirry.net"
Source = "https://github.com/nirry-dev/jsonmend"
Issues = "https://github.com/nirry-dev/jsonmend/issues"

[project.scripts]
jsonmend = "jsonmend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jsonmend"]

[tool.hatch.build.targets.sdist]
include = ["jsonmend", "tests", "README.md", "LICENSE", "CHANGELOG.md"]
